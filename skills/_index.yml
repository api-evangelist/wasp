notes: >-
  Wasp publishes an OFFICIAL agent plugin/skills package (wasp-lang/wasp-agent-plugins,
  plugin version 1.3.0) that works with Claude Code, Cursor, Codex, Gemini CLI, GitHub
  Copilot, OpenCode, and others. Install via `claude plugin marketplace add
  wasp-lang/wasp-agent-plugins` + `claude plugin install wasp@wasp-agent-plugins`, or
  `npx skills add wasp-lang/wasp-agent-plugins`. The SKILL.md files below are saved
  VERBATIM from the upstream repo; each skill's supporting reference files
  (authentication.md, database.md, styling.md, general-wasp-knowledge.md, etc.) live in
  the upstream repo alongside each SKILL.md. Wasp is a self-hosted framework (no hosted
  API/OpenAPI), so these skills operate the Wasp CLI and project codebase rather than
  HTTP operations. The plugin also bundles the third-party chrome-devtools MCP server
  for browser visibility (not a Wasp-hosted MCP server).
